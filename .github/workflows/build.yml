name: Build
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
      - name: Build
        run: |
          pyinstaller --onefile --windowed "Asset List Generator.py"
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: Asset-List-Generator-${{ matrix.os }}
          path: dist/*
